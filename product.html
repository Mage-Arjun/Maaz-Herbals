<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Product — MAAZ Herbals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="page.css">
    <link rel="stylesheet" href="premium.css">
</head>

<body>
    <div class="loader" id="loader"><img class="loader-seal" src="assets/maaz-seal.svg" alt="MAAZ Herbals seal">
        <div class="loader-name">MAAZ Herbals</div>
        <div class="loader-line"></div>
        <p>Preparing your botanical ritual...</p>
    </div>
    <div class="toast" id="toast"></div>
    <div class="scrim" id="scrim"></div>
    <aside class="cart" id="cart"><button class="close" data-close="cart">×</button>
        <p class="eyebrow">Your botanical basket</p>
        <h2>Shopping bag <span id="cartCount">(0)</span></h2>
        <div id="cartItems"></div>
        <div class="cart-bottom">
            <div><span>Subtotal</span><strong id="subtotal">₹0</strong></div><small>Shipping calculated at
                checkout</small><button class="button dark" id="checkout">Checkout</button>
        </div>
    </aside>
    <header class="nav scrolled" id="nav"><a class="brand" href="index.html"><i class="seal" aria-hidden="true"></i>MAAZ
            <span>Herbals</span></a>
        <nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="collections.html">Collections</a><a
                href="story.html">Our Story</a></nav>
        <div class="nav-actions"><button aria-label="Shopping bag" id="openCart">Bag <b
                    id="navCount">0</b></button><button class="menu" id="mobileMenu">☰</button></div>
    </header>
    <main id="productPage"></main>
    <footer><b class="foot-mark">MAAZ</b><a class="brand" href="index.html"><i class="seal" aria-hidden="true"></i>MAAZ
            <span>Herbals</span></a>
        <p>Nature’s rituals, reimagined.</p><small>© 2026 MAAZ Herbals · Frontend prototype</small>
    </footer>
    <div class="buybar" id="buybar"><span class="buybar-name" id="buybarName"></span><span class="buybar-price"
            id="buybarPrice"></span><button class="button dark" id="buybarAdd">Add to bag</button></div>
    <script src="app.js"></script>
</body>

</html>
